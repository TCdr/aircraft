[VERSION]
major = 1
minor = 0

[GENERAL]
atc_type = "TT:ATCCOM.ATC_NAME AIRBUS.0.text"
atc_model = "TT:ATCCOM.AC_MODEL A380.0.text"
Category = "airplane"
performance = "Todo"
wip_indicator = 2
icao_type_designator = "A388"
icao_manufacturer = "AIRBUS"
icao_model = "A-380-800"
icao_engine_type = Jet
icao_engine_count = 4
; the A380-800 is the only WTC J aircraft but MSFS does not support J as far as we know
; @see https://skybrary.aero/articles/icao-wake-turbulence-category
icao_WTC = H
icao_generic = 0

[PILOT]
pilot = "Pilot_Female_Uniform"
copilot = "Pilot_Male_Uniform"
instructor = "Pilot_Male_Casual"
pilot_default_animation = "Idle1_PoseAirliner"
copilot_default_animation = "Idle2_PoseAirliner"
pilot_attach_node = "PILOT_0"
copilot_attach_node = "PILOT_1"

[SERVICES]
FUELTRUCK = 1
BAGGAGE_LOADER = 1
CATERING_TRUCK = 1
BOARDING_RAMP = 1
GROUND_POWER_UNIT = 1
PUSHBACK = 1
SMALL_PUSHBACK = 0
MARSHALLER = 1
JETWAY = 1

[EFFECTS]
wake = fx_wake, 0
water = fx_spray, 0
dirt = FX_ASOBO_TOUCHDIRT_BIG, 0
concrete = FX_ASOBO_TOUCHCONCRETE_BIG, 0
touchdown = FX_ASOBO_TouchDown_Big, 1
contrail = FX_ASOBO_CONTRAIL_BIG, 0
effect.0 = FX_EXHAUST_LEFT1#(A:GENERAL ENG COMBUSTION:1, boolean)#FX_ASOBO_HEAT_BIG
effect.1 = FX_EXHAUST_RIGHT3#(A:GENERAL ENG COMBUSTION:2, boolean)#FX_ASOBO_HEAT_BIG
effect.2 = FX_EXHAUST_APU#(L:A32NX_APU_N_RAW, percent) 12 >#FX_ASOBO_HEAT_BIG
effect.3 = FX_EXHAUST_RIGHT2#(A:GENERAL ENG COMBUSTION:1, boolean)#FX_ASOBO_HEAT_BIG
effect.4 = FX_EXHAUST_RIGHT4#(A:GENERAL ENG COMBUSTION:2, boolean)#FX_ASOBO_HEAT_BIG
; The engine and APU fire visuals are ASOBO_GT_FX components of the model behaviour XML (ENGINE_FIRE_FX in
; attachments/flybywire/Part_Exterior_Wings/model/A380_WINGS.xml, APU_FIRE_FX in
; attachments/flybywire/Part_Exterior_Fuselage/model/A380_Fuselage_Behavior.xml): effect.N lines with the legacy fire
; effects (fx_engfire, FX_ASOBO_ENGINEFIRE_SMALL) showed nothing in MSFS 2024 (sim test 2026-10-09).
; effect.3 (engine 2, left inner) is on FX_EXHAUST_RIGHT2, the engine 2 exhaust node of A380_WINGS.gltf LOD00 and LOD01
; despite its name: FX_EXHAUST_LEFT2, at the same place, is missing from LOD01 (the haze vanished there).
waterspeed = fx_spray, 0
startup = fx_engstrt, 1
landrotorwash = fx_rtr_lnd, 0
waterrotorwash = fx_rtr_wtr, 0
vaportrail_l = fx_vaportrail_l, 0
vaportrail_r = fx_vaportrail_r, 0
l_wingtipvortice = fx_wingtipvortice_l, 1
r_wingtipvortice = fx_wingtipvortice_r, 1
fueldump = , 0
; The sim-driven stock engine fire effect (fx_engfire on ENG ON FIRE:n, which systems.wasm sets for a flyPad fire, at
; the engines.cfg engine position) is turned off: the model effects replace it, so a fire does not show twice and the
; flyPad Situation Visual Effects switch also covers it. fx_dummy is the SDK's "no effect" value.
EngineFire = fx_dummy, 0
; The sim-driven stock engine damage smoke (fx_engsmoke) is turned off too, for the flyPad Situation Visual Effects
; switch: A380_WINGS.xml ENGINE_DAMAGE_FX shows it again, on ENG FAILED:n and the switch.
EngineDamage = fx_dummy, 0
; The sim-driven stock engine oil leak smoke (fx_OilLeak) is turned off too, for the flyPad Situation Visual Effects
; switch: A380_WINGS.xml ENGINE_OIL_LEAK_FX shows it again, on the FBW oil leak (L:A32NX_ENGINE_n_OIL_LEAK) and the switch.
EngineOilLeak = fx_dummy, 0
SkidPavement = fx_skidmark, 0
SnowSkiTrack = , 0
WheelSnowSpray = fx_WheelSnowSpray, 0
WheelWetSpray = fx_WheelWetSpray, 0
WetEngineWash = fx_WetEngineWash, 0
SnowEngineWash = fx_SnowEngineWash, 0
WaterBallastDrain = fx_WaterBallastDrain, 0
PistonFailure = fx_PistonFailure, 1
windshield_rain_effect_available = 1

;===================== FLTSIM =====================
[IKCHAINS]
right_hand_target = ""
left_hand_target = ""
left_foot_target = ""
right_foot_target = ""
